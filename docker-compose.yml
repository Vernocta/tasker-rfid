# Local development stack for Tasker RFID.
# Postgres is the primary store (SPEC.md 2.4 — local-first).
# Mosquitto is the MQTT broker the readers (and the simulator) publish to.

services:
  postgres:
    image: postgres:16
    container_name: tasker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasker}
      POSTGRES_DB: ${POSTGRES_DB:-tasker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasker} -d ${POSTGRES_DB:-tasker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tasker-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  ingest:
    build: .
    container_name: tasker-ingest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      # Inside the compose network the other services are reachable by
      # their service names, not localhost, so these override .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tasker}:${POSTGRES_PASSWORD:-tasker}@postgres:5432/${POSTGRES_DB:-tasker}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC:-tasker/reads}
      MQTT_GATE_TOPIC: ${MQTT_GATE_TOPIC:-tasker/gates}
      # Fixed client id plus a persistent session: this is what lets the
      # broker hold reads for us while ingest is restarting, and redeliver
      # anything we never acknowledged.
      INGEST_CLIENT_ID: ${INGEST_CLIENT_ID:-tasker-ingest}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  debouncer:
    build: .
    container_name: tasker-debouncer
    restart: unless-stopped
    command: ["tasker-debouncer"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tasker}:${POSTGRES_PASSWORD:-tasker}@postgres:5432/${POSTGRES_DB:-tasker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
