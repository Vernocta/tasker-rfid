# Development broker configuration.
# Anonymous access is fine on an isolated warehouse LAN and on a laptop.
# Before production, add a password file and set allow_anonymous false.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# The ingest service does not acknowledge a message until Postgres has
# committed it, so the broker must be willing to have many messages in
# flight at once. Mosquitto's default of 20 would throttle ingest to 20
# reads per write batch, nowhere near the 900 reads/sec in SPEC.md
# section 10.
max_inflight_messages 5000

# How much the broker holds for a disconnected ingest service before it
# starts discarding. This is the buffer that covers an ingest restart.
max_queued_messages 200000
