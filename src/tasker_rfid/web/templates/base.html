<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }} — Tasker</title>
<link rel="icon" href="/static/favicon.svg">

<!-- Tailwind and the typefaces are served from this machine, not a CDN.
     The warehouse network drops (SPEC.md 2.4), and the screen by the dock
     must not lose its layout when it does. See static/vendor/README.md. -->
<link rel="stylesheet" href="/static/vendor/fonts.css">
<script src="/static/vendor/tailwind-3.4.17.js"></script>
<script>
  /* Tasker's identity, in one place. Change a colour here and it changes
     everywhere. */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          tasker: {
            blue: '#1D4ED8',      /* primary */
            blueDark: '#1E3FA8',  /* hover  */
            ink: '#0F172A',       /* body text, near black for contrast */
            muted: '#475569',     /* labels */
            line: '#CBD5E1',      /* rules between rows */
            wash: '#F1F5F9',      /* table headers, page furniture */
          },
        },
        fontFamily: {
          head: ['Archivo', 'system-ui', 'sans-serif'],
          body: ['"Public Sans"', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  /* Read from two or three metres away: everything is bigger than a
     desktop app would be, and numbers line up in columns. */
  html { font-size: 20px; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>

<body class="font-body text-tasker-ink bg-white">

<header class="border-b-2 border-tasker-ink">
  <div class="px-8 py-5 flex flex-wrap items-baseline gap-x-10 gap-y-3">
    <span class="font-head font-bold text-3xl text-tasker-blue">TASKER</span>
    <nav class="flex flex-wrap gap-x-8 gap-y-2">
      {% for item in nav %}
        <a href="{{ item.path }}"
           class="font-head font-semibold text-2xl py-2 border-b-4
                  {% if item.path == current_path %}
                    text-tasker-blue border-tasker-blue
                  {% else %}
                    text-tasker-muted border-transparent hover:text-tasker-ink
                  {% endif %}">{{ item.label }}</a>
      {% endfor %}
    </nav>
    <span id="updated" class="text-xl text-slate-500 ml-auto">Loading…</span>
  </div>
</header>

<main class="px-8 py-8">
  <h1 class="font-head font-bold text-5xl">{{ page_title }}</h1>
  <p class="text-2xl text-tasker-muted mt-2 mb-8 max-w-4xl">{% block subtitle %}{% endblock %}</p>
  {% block content %}{% endblock %}
</main>

<script>
  window.TASKER = {
    apiBase: {{ api_base | tojson }},
    pollSeconds: {{ poll_seconds }},
  };
</script>
<script src="/static/app.js"></script>
{% block script %}{% endblock %}
</body>
</html>
