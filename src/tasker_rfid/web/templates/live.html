{% extends "_screen.html" %}
{% block lede %}{{ t['live.lede'] }}{% endblock %}

{% block screen %}
<div class="mt-[1.4vh] flex-1 min-h-0 flex flex-col border-y-4 border-neutral-950">
  <div class="shrink-0 flex items-baseline gap-5 px-2 py-[1vh] bg-neutral-100 border-b-4 border-neutral-950">
    <span class="t-label font-bold text-neutral-600 uppercase w-[9ch]">{{ t['live.col.time'] }}</span>
    <span class="t-label font-bold text-neutral-600 uppercase w-[12ch]">{{ t['live.col.portal'] }}</span>
    <span class="t-label font-bold text-neutral-600 uppercase w-[24ch]">{{ t['live.col.tag'] }}</span>
    <span class="t-label font-bold text-neutral-600 uppercase flex-1">{{ t['live.col.identity'] }}</span>
    <span class="t-label font-bold text-neutral-600 uppercase w-[8ch] text-right">{{ t['live.col.reads'] }}</span>
  </div>
  <div id="rows" class="flex-1 min-h-0 overflow-y-auto biglist"></div>
</div>
{% endblock %}

{% block script %}
<script>
/* At the exit the beams say which way it went. The entrance has no beams,
   because a container coming into storage is unambiguous. */
function whichWay(observation) {
  if (observation.portal !== "EXIT") return "";
  if (observation.direction === "OUT") return t("live.leaving");
  if (observation.direction === "IN") return t("live.entering");
  return t("live.no_direction");
}

function identity(observation) {
  if (!observation.container_id) {
    return `<span class="text-red-700 font-bold">${text(t("live.unknown_tag"))}</span>`;
  }
  const what = observation.contents
    || `${observation.kind} ${t("live.nothing_recorded")}`;
  return `${text(what)}<span class="text-neutral-500"> · ${text(statusWords(observation.status))}</span>`;
}

function liveRow(observation) {
  const way = whichWay(observation);
  return `<div class="flex items-baseline gap-5 px-2 py-[1.1vh] border-b-2 border-neutral-300">
    <div class="t-row num w-[9ch] shrink-0">${clockTime(observation.last_read)}</div>
    <div class="w-[12ch] shrink-0">
      <div class="t-row font-head font-bold">${text(observation.portal)}</div>
      ${way ? `<div class="t-label text-neutral-600 tracking-normal">${text(way)}</div>` : ""}
    </div>
    <div class="t-label num text-neutral-500 w-[24ch] shrink-0 truncate tracking-normal">${text(observation.tid)}</div>
    <div class="t-row flex-1 min-w-0 truncate">${identity(observation)}</div>
    <div class="t-row num text-neutral-500 w-[8ch] text-right">${number(observation.read_count)}</div>
  </div>`;
}

startPolling(async () => {
  const observations = await apiGet("/observations", { limit: 50 });
  fillList("rows", observations, liveRow, t("live.empty"));
});
</script>
{% endblock %}
