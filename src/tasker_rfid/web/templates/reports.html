{% extends "_screen.html" %}
{% block lede %}{{ t['rep.lede'] }}{% endblock %}

{% block screen %}
<div class="shrink-0 mt-[1.4vh] flex flex-wrap items-end gap-6">
  <label class="grid gap-2">
    <span class="t-label font-bold tracking-[0.15em] text-neutral-600">{{ t['rep.from'] }}</span>
    <input id="from" type="date"
           class="border-4 border-neutral-950 px-4 py-[1.2vh] text-[clamp(16px,2.6vh,32px)] font-head font-bold" />
  </label>
  <label class="grid gap-2">
    <span class="t-label font-bold tracking-[0.15em] text-neutral-600">{{ t['rep.to'] }}</span>
    <input id="to" type="date"
           class="border-4 border-neutral-950 px-4 py-[1.2vh] text-[clamp(16px,2.6vh,32px)] font-head font-bold" />
  </label>
  <button id="show" type="button"
          class="bg-brand text-white font-head font-extrabold text-[clamp(16px,2.6vh,32px)]
                 px-8 py-[1.2vh] active:bg-brandDark">{{ t['rep.show'] }}</button>
  <button id="last90" type="button"
          class="border-4 border-neutral-950 font-head font-extrabold text-[clamp(16px,2.6vh,32px)]
                 px-8 py-[1.2vh]">{{ t['rep.last90'] }}</button>
  <span id="period" class="t-lede text-neutral-600"></span>
</div>
<p id="range-error" class="hidden shrink-0 mt-2 text-[clamp(16px,2.4vh,30px)] font-bold text-red-700"></p>

<div class="mt-[1.4vh] flex-1 min-h-0 flex flex-col border-y-4 border-neutral-950">
  <div class="shrink-0 flex items-baseline gap-6 px-2 py-[1vh] bg-neutral-100 border-b-4 border-neutral-950">
    <span class="t-label font-bold text-neutral-600 uppercase w-[30ch]">{{ t['rep.col.customer'] }}</span>
    <span class="t-label font-bold text-neutral-600 uppercase flex-1">{{ t['rep.col.product'] }}</span>
    <span class="t-label font-bold text-neutral-600 uppercase text-right">{{ t['rep.col.boxes'] }}</span>
  </div>
  <div id="rows" class="flex-1 min-h-0 overflow-y-auto biglist"></div>
</div>

<div class="shrink-0 flex items-baseline gap-6 px-2 py-[1.2vh] border-b-4 border-neutral-950">
  <span class="font-head font-extrabold text-[clamp(20px,3.4vh,44px)] flex-1">{{ t['rep.total'] }}</span>
  <span id="total" class="font-head font-extrabold text-brand t-figure num">—</span>
</div>
{% endblock %}

{% block script %}
<script>
function isoDay(date) { return date.toISOString().slice(0, 10); }

/* Default to the last 90 days, the window SPEC.md asks for. */
document.getElementById("to").value = isoDay(new Date());
document.getElementById("from").value = isoDay(new Date(Date.now() - 90 * 864e5));

function consumptionRow(line) {
  return `<div class="flex items-baseline gap-6 px-2 py-[1.3vh] border-b-2 border-neutral-300">
    <div class="t-rowbig font-head font-bold w-[30ch] shrink-0 truncate">${text(line.customer)}</div>
    <div class="t-row flex-1 min-w-0 truncate">${text(line.sku)}</div>
    <div class="font-head font-extrabold t-figure num text-right">${number(line.boxes)}</div>
  </div>`;
}

async function refresh() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const error = document.getElementById("range-error");
  error.classList.add("hidden");

  if (from && to && from > to) {
    error.textContent = t("rep.bad_range");
    error.classList.remove("hidden");
    return;
  }

  const lines = await apiGet("/reports/consumption", { from_date: from, to_date: to });
  document.getElementById("period").textContent = t("rep.period", { from: from, to: to });
  fillList("rows", lines, consumptionRow, t("rep.empty"));
  const total = lines.reduce((sum, line) => sum + Number(line.boxes), 0);
  document.getElementById("total").textContent = lines.length ? number(total) : "—";
}

document.getElementById("show").onclick = refresh;
document.getElementById("last90").onclick = () => {
  document.getElementById("to").value = isoDay(new Date());
  document.getElementById("from").value = isoDay(new Date(Date.now() - 90 * 864e5));
  refresh();
};

startPolling(refresh);
</script>
{% endblock %}
