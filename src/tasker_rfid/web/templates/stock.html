{% extends "_screen.html" %}
{% block lede %}{{ t['stock.lede'] }}{% endblock %}

{% block screen %}
<div class="mt-[1.4vh] flex-1 min-h-0 flex flex-col border-y-4 border-neutral-950">
  <div class="shrink-0 flex items-baseline gap-6 px-2 py-[1vh] bg-neutral-100 border-b-4 border-neutral-950">
    <span class="t-label font-bold text-neutral-600 uppercase w-[22ch]">{{ t['stock.col.sku'] }}</span>
    <span class="t-label font-bold text-neutral-600 uppercase flex-1">{{ t['stock.col.product'] }}</span>
    <span class="t-label font-bold text-neutral-600 uppercase text-right">{{ t['stock.col.boxes'] }}</span>
  </div>
  <div id="rows" class="flex-1 min-h-0 overflow-y-auto biglist"></div>
</div>

<div class="shrink-0 flex items-baseline gap-6 px-2 py-[1.2vh] border-b-4 border-neutral-950">
  <span class="font-head font-extrabold text-[clamp(20px,3.4vh,44px)] flex-1">{{ t['stock.total'] }}</span>
  <span id="total" class="font-head font-extrabold text-brand t-figure num">—</span>
</div>
{% endblock %}

{% block script %}
<script>
function stockRow(line) {
  return `<div class="flex items-baseline gap-6 px-2 py-[1.3vh] border-b-2 border-neutral-300">
    <div class="t-row num text-neutral-600 w-[22ch] shrink-0 truncate">${text(line.sku_id)}</div>
    <div class="t-rowbig font-head font-bold flex-1 min-w-0 truncate">${text(line.name)}</div>
    <div class="font-head font-extrabold t-figure num text-right">${number(line.boxes)}</div>
  </div>`;
}

startPolling(async () => {
  const lines = await apiGet("/stock");
  fillList("rows", lines, stockRow, t("stock.empty"));
  const total = lines.reduce((sum, line) => sum + Number(line.boxes), 0);
  document.getElementById("total").textContent = lines.length ? number(total) : "—";
});
</script>
{% endblock %}
