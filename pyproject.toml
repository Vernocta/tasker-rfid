[project]
name = "tasker-rfid"
version = "0.1.0"
description = "RFID stock control for Tasker S.A. — see SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "paho-mqtt>=2.0",
]

[project.scripts]
tasker-seed = "tasker_rfid.seed:main"
sim = "tasker_rfid.services.simulator.cli:main"
tasker-ingest = "tasker_rfid.services.ingest.service:main"
tasker-debouncer = "tasker_rfid.services.debouncer.service:main"
tasker-state-engine = "tasker_rfid.services.state_engine.service:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasker_rfid"]

[tool.pytest.ini_options]
# tests/integration/conftest.py is imported by name from the test module,
# so its directory has to be on the path.
testpaths = ["tests"]
