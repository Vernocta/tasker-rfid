# Runtime tuning. This file is SPEC.md section 8, verbatim.
# Change values here, not in code.

# NOT YET READ BY ANY CODE. The schema supports all three topologies
# without a migration -- containers nest, so a box, a pallet or both can
# carry the tags -- but switching between them is a code change, not a
# config change. Recorded here because the RF test decides it (SPEC.md 11);
# wire it up when that answer arrives.
mode: hybrid                # box_level | pallet_level | hybrid

# NOT YET READ BY ANY CODE. These configure a physical reader, and there
# is no reader yet -- the simulator models its behaviour instead. They go
# live at build step 10.
rf:
  tx_power_dbm: 25
  session: 2

filters:
  quiet_period_ms: 2000
  rssi_floor_dbm: -65
  min_read_count: 3

portals:
  entrance:
    antennas: [1, 2]
  exit:
    antennas: [3, 4]
    ir_gate_timeout_ms: 3000
    # The IR beam gate at this portal. Two beams a few centimetres apart:
    # INNER faces the warehouse, OUTER faces the street. Breaking INNER
    # then OUTER means something is leaving. The entrance has no gate --
    # SPEC.md section 4 says the entrance uses the state machine alone.
    gate_id: GATE-EXIT

health:
  no_read_alert_hours: 4
  working_hours: "08:00-18:00"
  timezone: "America/Argentina/Buenos_Aires"
